name: API

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/api.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velvet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d velvet_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velvet_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production dependency bar: 0 high/critical. Full-tree (dev) audit may
      # still report Wrangler/miniflare toolchain issues — track separately.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

      - name: Prisma generate
        run: pnpm --filter velvet-api prisma:generate

      - name: Migrate deploy (empty DB)
        run: pnpm --filter velvet-api exec prisma migrate deploy

      - name: Assert zero Prisma schema drift
        run: >
          pnpm --filter velvet-api exec prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Typecheck
        run: pnpm --filter velvet-api typecheck

      - name: Build
        run: pnpm --filter velvet-api build

      - name: Worker bundle smoke
        run: |
          test -f services/api/dist/src/worker.js
          node --check services/api/dist/src/worker.js

      - name: Unit tests
        run: pnpm --filter velvet-api test
