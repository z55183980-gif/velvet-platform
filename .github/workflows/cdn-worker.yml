name: CDN Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/velvet-cdn/**'
      - '.github/workflows/cdn-worker.yml'
  pull_request:
    paths:
      - 'workers/velvet-cdn/**'
      - '.github/workflows/cdn-worker.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck CDN worker
        run: pnpm --filter velvet-cdn typecheck
