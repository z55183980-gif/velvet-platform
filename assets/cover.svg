  <g transform="translate(80,584)">
    <text x="0" y="0" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="14" fill="#94A3B8" font-weight="600">STACK</text>
    <g transform="translate(70,-14)">
      <rect width="96" height="28" rx="14" fill="#1F2937" stroke="#334155"/>
      <text x="48" y="18" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="13" fill="#E2E8F0">Next.js 16</text>
    </g>
    <g transform="translate(178,-14)">
      <rect width="96" height="28" rx="14" fill="#1F2937" stroke="#334155"/>
      <text x="48" y="18" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="13" fill="#E2E8F0">NestJS 11</text>
    </g>
    <g transform="translate(286,-14)">
      <rect width="96" height="28" rx="14" fill="#1F2937" stroke="#334155"/>
      <text x="48" y="18" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="13" fill="#E2E8F0">Prisma 6</text>
    </g>
    <g transform="translate(394,-14)">
      <rect width="108" height="28" rx="14" fill="#1F2937" stroke="#334155"/>
      <text x="54" y="18" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="13" fill="#E2E8F0">Postgres 16</text>
    </g>
    <g transform="translate(514,-14)">
      <rect width="80" height="28" rx="14" fill="#1F2937" stroke="#334155"/>
      <text x="40" y="18" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="13" fill="#E2E8F0">FFmpeg</text>
    </g>
    <g transform="translate(606,-14)">
      <rect width="80" height="28" rx="14" fill="#1F2937" stroke="#334155"/>
      <text x="40" y="18" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="13" fill="#E2E8F0">HLS.js</text>
    </g>
  </g>

  <g transform="translate(1100,584)">
    <text x="0" y="0" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="14" fill="#64748B">github.com/opc007/velvet-platform</text>
  </g>
